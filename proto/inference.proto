// inference.proto
//
// The protocol contract for resumable gRPC server-streaming LLM inference.
// This schema is the thing being demonstrated: a thin, intentional protocol
// layer on top of standard gRPC that makes dropped token streams resumable.
//
// The core idea encoded here: the client tracks a monotonically increasing
// token_index (its "dead reckoning" position in the stream). When a stream
// drops, the client reconnects and asks the server to resume from that index.
// The server replays the already-generated tokens from its journal, then
// continues streaming live tokens from the SAME run — so the client never sees
// a gap, a duplicated token, or a second completion.
//
// Ownership model: generation belongs to a SESSION, not to a call. Generate
// attaches the caller to the session's generation job; if the call dies, the
// job keeps producing tokens into the journal. That is why resumption is a
// checkpointing problem (replay from a journal), not a retry problem (re-run
// the model): the dropped call was only ever a listener.
//
// ACKs (added for the conference talk): during a long stream the client
// periodically confirms its position with Ack(session_id, acked_token_index).
// The server records the client's confirmed watermark and may TRIM journaled
// tokens below it (the client no longer needs them), keeping memory bounded
// for very long generations. acked_token_index semantics: the index of the
// LAST token the client has fully received and rendered.

syntax = "proto3";

package inference;

service InferenceService {
  // Generate attaches the caller to a session's generation job.
  //   - session unknown            -> start a job, stream from token 0
  //   - resume_from_token >= head  -> replay the journal from that index, then
  //                                   stream live tokens from the same job
  //   - resume_from_token < head   -> FAILED_PRECONDITION with the first
  //                                   retained index in trailing metadata. The
  //                                   client must resync rather than silently
  //                                   accept a gap.
  rpc Generate(GenerateRequest) returns (stream GenerateResponse);

  // Ack records the client's confirmed watermark for a session. The server
  // uses it to trim journaled tokens the client no longer needs and to answer
  // state-recovery queries (a client that lost its local cursor can learn the
  // last index it confirmed).
  rpc Ack(AckRequest) returns (AckResponse);

  // Cancel ends a session's generation job and frees the upstream inference.
  // A dropped call is a detach, not a cancel: only this stops the model.
  // Idempotent — cancelling a completed or unknown session is not an error.
  rpc Cancel(CancelRequest) returns (CancelResponse);
}

message GenerateRequest {
  string prompt = 1;
  // Required. Identifies the generation job; a resume must reuse the same id.
  string session_id = 2;
  // Index AFTER the last token the client has fully received.
  int32 resume_from_token = 3;
}

message GenerateResponse {
  string token = 1;
  int32 token_index = 2;
  bool is_final = 3;
  // True when this token came from the journal rather than the model. Lets a
  // client (and the benchmark) separate replayed tokens from live ones.
  bool replayed = 4;
}

message AckRequest {
  string session_id = 1;
  int32 acked_token_index = 2;
}

message AckResponse {
  string session_id = 1;
  // The server's confirmed watermark after applying this ACK.
  int32 acked_token_index = 2;
  // Number of journaled tokens still retained (post-trim) for this session.
  int32 journaled_token_count = 3;
  // Index of the first token still retained in the journal (0 if none).
  int32 first_retained_index = 4;
}

message CancelRequest {
  string session_id = 1;
}

message CancelResponse {
  string session_id = 1;
  // Last token index journaled before cancellation (-1 if unknown session).
  int32 cancelled_at_token = 2;
  // False when the session had already finished or never existed.
  bool was_running = 3;
}
